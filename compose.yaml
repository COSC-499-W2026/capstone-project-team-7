services:
  frontend:
    build:
      context: ./src/frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
