services:
  backend:
    build:
      context: ./src/backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/hello')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  frontend:
    build:
      context: ./src/frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
