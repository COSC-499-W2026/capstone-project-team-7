name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      # The final step commits updated test reports to the dev branch.
      contents: write
    # GitHub starts a fresh PostgreSQL container for this job and removes it afterward.
    services:
      postgres:
        image: postgres:17
        env:
          # Disposable CI credentials; these do not connect to the local app database.
          POSTGRES_DB: lit_test
          POSTGRES_USER: lit_test
          POSTGRES_PASSWORD: lit_test_password
        ports:
          # Expose the service to Python commands running on the GitHub runner.
          - 5432:5432
        # Wait for PostgreSQL to accept connections before running the job's steps.
        options: >-
          --health-cmd "pg_isready -U lit_test -d lit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The migration command and backend use DATABASE_URL.
      DATABASE_URL: postgresql://lit_test:lit_test_password@localhost:5432/lit_test
      # Integration tests create and remove a temporary schema in this database.
      TEST_DATABASE_URL: postgresql://lit_test:lit_test_password@localhost:5432/lit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r src/backend/requirements.txt
      - run: pip install pytest httpx pytest-html
      # Apply the same versioned schema and catalog seeds used in local development.
      - run: python src/backend/migrate.py
      # Run API and database tests, producing XML and HTML reports.
      - run: >
          python -m pytest tests/backend
          --junitxml=test-results/results.xml
          --html=test-results/report.html --self-contained-html

      # Keep reports available for download even when a test fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/

      - name: Save report into repo (only after tests pass)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          mkdir -p test-reports
          cp test-results/report.html test-reports/report.html
          cp test-results/results.xml test-reports/results.xml
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add test-reports
          git commit -m "Update CI test report [skip ci]" || echo "Nothing to commit"
          git pull --rebase
          git push
